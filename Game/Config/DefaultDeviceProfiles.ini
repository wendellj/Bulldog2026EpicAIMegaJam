[/Script/Engine.DeviceProfileManager]
; Project override of the engine's Meta_Quest_3 device profile.
; Same section name as the engine one, so it inherits everything the engine
; shipped (Vulkan, multiview, xr.VRS.DynamicFoveation=1, Adreno occlusion mode)
; and only adds project tuning on top.

[Meta_Quest_3 DeviceProfile]
DeviceType=Android
BaseProfileName=Android_OpenXR
+CVars=r.MSAACount=2
+CVars=r.MobileContentScaleFactor=1.0
+CVars=r.Mobile.AntiAliasing=3
+CVars=sg.ShadowQuality=2
+CVars=sg.PostProcessQuality=1
+CVars=sg.TextureQuality=2
